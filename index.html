    <title>GQbox — Product Operating System</title>
    <style>
      html,body{height:100%;background:#0a0a0f;color:#f2f2f9;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
      .skip-link{position:fixed;top:-120px;left:8px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(20,20,26,.92);border:1px solid rgba(192,132,252,.3);border-radius:10px;color:#f2f2f9;font-size:13px;font-weight:500;text-decoration:none;letter-spacing:.02em;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 24px rgba(0,0,0,.4),0 0 0 1px rgba(192,132,252,.1),inset 0 1px 0 rgba(255,255,255,.05);transition:top .3s cubic-bezier(.22,1,.36,1),opacity .2s ease;opacity:0;outline:none}
      .skip-link::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#c084fc;box-shadow:0 0 8px rgba(192,132,252,.25)}
      .skip-link:focus,.skip-link:focus-visible{top:8px;opacity:1;border-color:rgba(192,132,252,.5);box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(192,132,252,.15),inset 0 1px 0 rgba(255,255,255,.08);outline:2px solid rgba(192,132,252,.4);outline-offset:2px}
      .noscript-fallback{display:none;position:fixed;inset:0;z-index:9998;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;padding:clamp(1rem,2vw + .5rem,1.5rem);text-align:center}
      .noscript-fallback .logo{font-size:clamp(2.25rem,4.5vw + 1rem,4.1rem);font-weight:700;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,#c084fc,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin-bottom:clamp(.25rem,.5vw + .25rem,.5rem)}
      .noscript-fallback .sub{font-size:clamp(.625rem,.8vw + .4rem,.8125rem);font-weight:400;color:#7a7a90;letter-spacing:.06em;text-transform:uppercase;margin-bottom:clamp(1.5rem,2vw + .5rem,2rem)}
      .noscript-fallback p{font-size:clamp(.75rem,.8vw + .4rem,.875rem);color:#7a7a90;max-width:clamp(280px,50vw,400px);line-height:1.7;margin:0;margin-bottom:.25rem}
      .noscript-fallback .lang-ru p:first-child,.noscript-fallback .lang-en p:first-child{font-size:clamp(1rem,1.2vw + .5rem,1.25rem);color:#b0b0c4}
      .noscript-fallback p:last-of-type{margin-bottom:0}
      .noscript-fallback input{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
      .noscript-fallback .lang-en{display:none}
      .noscript-fallback #hl-ru:checked ~ .lang-en{display:none}
      .noscript-fallback #hl-ru:checked ~ .lang-ru{display:block}
      .noscript-fallback #hl-en:checked ~ .lang-ru{display:none}
      .noscript-fallback #hl-en:checked ~ .lang-en{display:block}
      .noscript-fallback .lang-toggle{display:inline-flex;margin-top:clamp(1rem,1.5vw + .5rem,1.5rem);border:1px solid rgba(255,255,255,.08);border-radius:.5rem;overflow:hidden}
      .noscript-fallback .lang-toggle label{padding:clamp(.25rem,.5vw + .125rem,.375rem) clamp(.625rem,.8vw + .25rem,.875rem);font-size:clamp(.625rem,.5vw + .375rem,.75rem);font-weight:500;color:#7a7a90;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .15s}
      .noscript-fallback .lang-toggle label:hover{background:rgba(255,255,255,.04)}
      .noscript-fallback #hl-ru:checked ~ .lang-toggle label[for="hl-ru"],.noscript-fallback #hl-en:checked ~ .lang-toggle label[for="hl-en"]{background:rgba(192,132,252,.15);color:#c084fc}
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Перейти к содержимому</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div class="noscript-fallback">
        <input type="radio" name="hl" id="hl-ru" checked>
        <input type="radio" name="hl" id="hl-en">
        <div class="logo">GQbox</div>
        <div class="sub">Product Operating System</div>
        <div class="lang-ru">
          <p>Для работы требуется JavaScript.</p>
          <p>Пожалуйста, включите его в настройках браузера.</p>
        </div>
        <div class="lang-en">
          <p>GQbox requires JavaScript.</p>
          <p>Please enable it in your browser settings.</p>
        </div>
        <div class="lang-toggle">
          <label for="hl-ru">RU</label>
          <label for="hl-en">EN</label>
        </div>
      </div>
      <style>.noscript-fallback{display:flex}</style>
    </noscript>
  </body>
</html>
